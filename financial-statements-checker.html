<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Period Financial Statement Checker</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --green: #34d399;
        --amber: #fbbf24;
        --red: #f87171;
        --cyan: #67e8f9;
        --border: rgba(148, 163, 184, 0.25);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
      }

      .wrap {
        max-width: 1200px;
        margin: 32px auto;
        padding: 16px;
      }

      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        color: var(--muted);
        line-height: 1.5;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 16px;
      }

      textarea {
        width: 100%;
        min-height: 420px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0b1220;
        color: var(--text);
        font-family: "Courier New", monospace;
        font-size: 13px;
        padding: 12px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: #03131b;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }

      button.secondary {
        background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      }

      .summary {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(3, minmax(150px, 1fr));
        gap: 12px;
      }

      .metric {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        background: rgba(15, 23, 42, 0.8);
      }

      .metric-label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
      }

      .metric-value {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .results {
        margin-top: 18px;
      }

      .result-block {
        margin-top: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        overflow: hidden;
      }

      .result-head {
        background: rgba(30, 41, 59, 0.9);
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      tr.flagged {
        background: rgba(248, 113, 113, 0.06);
      }

      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .status.ok { background: rgba(52, 211, 153, 0.12); color: var(--green); }
      .status.bad { background: rgba(248, 113, 113, 0.12); color: var(--red); }

      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; }
        .summary { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>Multi-Period Financial Statement Checker</h1>
        <p>
          Paste a set of monthly financial statements and the checker will evaluate all periods together,
          preserving the statement name in each result row.
        </p>

        <div class="grid">
          <div>
            <textarea id="jsonInput"></textarea>
            <div class="actions">
              <button id="loadSampleBtn">Load sample</button>
              <button id="runBtn" class="secondary">Run checks</button>
            </div>
          </div>

          <div>
            <div class="summary">
              <div class="metric">
                <span class="metric-label">Statements</span>
                <span class="metric-value" id="statementsCount">0</span>
              </div>
              <div class="metric">
                <span class="metric-label">Rows</span>
                <span class="metric-value" id="rowsCount">0</span>
              </div>
              <div class="metric">
                <span class="metric-label">Flags</span>
                <span class="metric-value" id="flagsCount">0</span>
              </div>
            </div>

            <div class="result-block">
              <div class="result-head">Messages</div>
              <div id="messages" style="padding: 12px; color: var(--muted); min-height: 140px;">
                No checks run yet.
              </div>
            </div>
          </div>
        </div>

        <div id="results" class="results"></div>
      </div>
    </div>

    <script>
      const sampleStatements = [
        {
          statement: 'January 2026',
          rows: [
            { account: 'Cash', current: 1200000, prior: 1000000, rowRef: 1 },
            { account: 'Accounts Receivable', current: 420000, prior: 380000, rowRef: 2 },
            { account: 'Inventory', current: 600000, prior: 500000, rowRef: 3 },
            { account: 'Accounts Payable', current: 300000, prior: 280000, rowRef: 4 }
          ]
        },
        {
          statement: 'February 2026',
          rows: [
            { account: 'Cash', current: 1300000, prior: 1200000, rowRef: 5 },
            { account: 'Accounts Receivable', current: 450000, prior: 420000, rowRef: 6 },
            { account: 'Inventory', current: 620000, prior: 600000, rowRef: 7 },
            { account: 'Accounts Payable', current: 325000, prior: 300000, rowRef: 8 }
          ]
        }
      ];

      const jsonInput = document.getElementById('jsonInput');
      const resultsEl = document.getElementById('results');
      const messagesEl = document.getElementById('messages');
      const statementsCountEl = document.getElementById('statementsCount');
      const rowsCountEl = document.getElementById('rowsCount');
      const flagsCountEl = document.getElementById('flagsCount');

      function fmtMoney(v) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v);
      }

      function normalizeStatements(value) {
        if (!Array.isArray(value)) {
          throw new Error('Input must be an array of statements');
        }

        return value.map((statement, index) => {
          if (!statement || typeof statement !== 'object') {
            throw new Error(`Statement at index ${index} is invalid`);
          }

          const statementName = String(statement.statement || statement.month || `Statement ${index + 1}`);
          const rows = Array.isArray(statement.rows) ? statement.rows : [];

          return {
            statement: statementName,
            rows: rows.map((row, rowIndex) => ({
              account: String(row.account || `Account ${rowIndex + 1}`),
              current: Number(row.current ?? row.currentPeriod ?? 0),
              prior: Number(row.prior ?? row.priorPeriod ?? 0),
              rowRef: Number(row.rowRef ?? rowIndex + 1),
            }))
          };
        });
      }

      function flattenFinancialStatements(statements) {
        return statements.flatMap((statement) =>
          statement.rows.map((row, index) => ({
            account: row.account,
            category: 'FS',
            currentPeriod: row.current,
            priorPeriod: row.prior,
            rowRef: row.rowRef || index + 1,
            period: statement.statement,
            periodLabel: statement.statement,
          }))
        );
      }

      function variancePct(currentPeriod, priorPeriod) {
        if (priorPeriod === 0) {
          return currentPeriod === 0 ? 0 : 100;
        }
        return ((currentPeriod - priorPeriod) / Math.abs(priorPeriod)) * 100;
      }

      function analyzeVariance(rows, thresholdPct = 10, thresholdVal = 100000) {
        return rows.map((item, index) => {
          const delta = item.currentPeriod - item.priorPeriod;
          const pct = variancePct(item.currentPeriod, item.priorPeriod);
          const flagged = Math.abs(delta) >= thresholdVal && Math.abs(pct) >= thresholdPct;

          return {
            rowIndex: index + 1,
            period: item.period,
            account: item.account,
            currentPeriod: item.currentPeriod,
            priorPeriod: item.priorPeriod,
            varianceVal: delta,
            variancePct: pct,
            flagged,
            flagReason: flagged
              ? `Variance ${delta >= 0 ? '+' : ''}${fmtMoney(delta)} (${pct.toFixed(1)}%) exceeds thresholds`
              : 'Within thresholds',
          };
        });
      }

      function analyzeTrialBalance(rows) {
        const byPeriod = new Map();

        rows.forEach((row) => {
          const bucket = byPeriod.get(row.period) || [];
          bucket.push(row);
          byPeriod.set(row.period, bucket);
        });

        const periodSummaries = [];

        for (const [period, bucket] of byPeriod.entries()) {
          let totalDebits = 0;
          let totalCredits = 0;

          bucket.forEach((row) => {
            totalDebits += Number(row.currentPeriod) || 0;
            totalCredits += Number(row.priorPeriod) || 0;
          });

          const imbalance = Math.abs(totalDebits - totalCredits);
          const balanced = imbalance < 0.01;
          periodSummaries.push({ period, totalDebits, totalCredits, imbalance, balanced });
        }

        const detailRows = rows.map((row) => {
          const periodSummary = periodSummaries.find((s) => s.period === row.period);
          const diff = row.currentPeriod - row.priorPeriod;
          const flagged = !periodSummary?.balanced || row.currentPeriod < 0 || row.priorPeriod < 0;

          return {
            period: row.period,
            account: row.account,
            currentPeriod: row.currentPeriod,
            priorPeriod: row.priorPeriod,
            varianceVal: diff,
            flagged,
            reason: flagged
              ? periodSummary && !periodSummary.balanced
                ? `TB imbalance for ${row.period}: ${fmtMoney(periodSummary.imbalance)}`
                : 'Unusual sign in statement row'
              : 'Balanced within period',
          };
        });

        return { periodSummaries, detailRows };
      }

      function renderResults(data) {
        resultsEl.innerHTML = '';

        const variance = data.variance;
        const tb = data.trialBalance;
        const flaggedCount = variance.filter((r) => r.flagged).length + tb.detailRows.filter((r) => r.flagged).length;
        flagsCountEl.textContent = String(flaggedCount);

        const blocks = [
          {
            title: `Variance checks (${variance.length} rows)`,
            rows: variance,
            kind: 'variance'
          },
          {
            title: `Trial balance checks (${tb.detailRows.length} rows)`,
            rows: tb.detailRows,
            kind: 'tb'
          }
        ];

        blocks.forEach((block) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'result-block';

          const head = document.createElement('div');
          head.className = 'result-head';
          head.textContent = block.title;
          wrapper.appendChild(head);

          const table = document.createElement('table');

          const headers = document.createElement('tr');
          ['Period', 'Account', 'Current', 'Prior', 'Delta', 'Flag', 'Reason'].forEach((label) => {
            const th = document.createElement('th');
            th.textContent = label;
            headers.appendChild(th);
          });
          table.appendChild(headers);

          block.rows.forEach((row) => {
            const tr = document.createElement('tr');
            if (row.flagged || row.flagged === true) tr.classList.add('flagged');

            const values = block.kind === 'variance'
              ? [
                  row.period,
                  row.account,
                  fmtMoney(row.currentPeriod),
                  fmtMoney(row.priorPeriod),
                  `${row.varianceVal >= 0 ? '+' : ''}${fmtMoney(row.varianceVal)}`,
                  row.flagged ? 'Flagged' : 'OK',
                  row.flagReason
                ]
              : [
                  row.period,
                  row.account,
                  fmtMoney(row.currentPeriod),
                  fmtMoney(row.priorPeriod),
                  `${row.varianceVal >= 0 ? '+' : ''}${fmtMoney(row.varianceVal)}`,
                  row.flagged ? 'Flagged' : 'OK',
                  row.reason
                ];

            values.forEach((value) => {
              const td = document.createElement('td');
              td.textContent = value;
              tr.appendChild(td);
            });

            table.appendChild(tr);
          });

          wrapper.appendChild(table);
          resultsEl.appendChild(wrapper);
        });
      }

      function runChecks() {
        try {
          const raw = jsonInput.value.trim();
          if (!raw) {
            throw new Error('Please paste a statement array or use the sample data.');
          }

          const parsed = JSON.parse(raw);
          const statements = normalizeStatements(parsed);
          const flatRows = flattenFinancialStatements(statements);

          statementsCountEl.textContent = String(statements.length);
          rowsCountEl.textContent = String(flatRows.length);

          const variance = analyzeVariance(flatRows);
          const trialBalance = analyzeTrialBalance(flatRows);

          const flaggedVariance = variance.filter((r) => r.flagged).length;
          const flaggedTB = trialBalance.detailRows.filter((r) => r.flagged).length;
          const messages = [
            `Processed ${statements.length} financial statements`,
            `Flattened to ${flatRows.length} rows across all periods`,
            `${flaggedVariance} variance rows flagged`,
            `${flaggedTB} trial-balance rows flagged`,
          ];

          messagesEl.innerHTML = messages.map((msg) => `<div>${msg}</div>`).join('');
          renderResults({ variance, trialBalance });
        } catch (error) {
          messagesEl.innerHTML = `<div style="color: #fca5a5;">${error.message}</div>`;
          resultsEl.innerHTML = '';
          flagsCountEl.textContent = '0';
        }
      }

      document.getElementById('loadSampleBtn').addEventListener('click', function () {
        jsonInput.value = JSON.stringify(sampleStatements, null, 2);
        runChecks();
      });

      document.getElementById('runBtn').addEventListener('click', runChecks);

      jsonInput.value = JSON.stringify(sampleStatements, null, 2);
      runChecks();
    </script>
  </body>
</html>
