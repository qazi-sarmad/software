name: Apply pending migrations to the hosted test project

# The shared test project is the backend the Playwright suite (ci.yml step 8) drives. Its schema
# must match the branch under test. CI step 7 was moved to a runner-local cluster to spare the
# project's Disk IO budget, which means the hosted project stopped receiving new migrations; a
# branch that adds a migration then fails step 8 on a missing column or table. This workflow
# applies only the pending migrations (by version) so the hosted schema catches up once per merge.
#
# It is idempotent: every migration in this repository uses `if not exists` / `create or replace`,
# and the local SQL harness proves each applies twice.

on:
  workflow_dispatch:
    inputs:
      from_version:
        description: First migration number to apply
        required: true
        default: '0119'
  push:
    branches: [feature/systeligon-unified-v1]
    paths: ['.github/workflows/hosted-migrate.yml']

concurrency:
  group: provio-test-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Apply pending migrations
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y postgresql-client >/dev/null
          DB="${TEST_SUPABASE_DB_URL//[$'\r\n\t ']/}"
          if [ -z "$DB" ]; then echo "::error::TEST_SUPABASE_DB_URL is empty"; exit 1; fi
          FROM="${{ github.event.inputs.from_version }}"
          applied=0
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            num="${base%%_*}"
            if [ "$num" -lt "$FROM" ]; then continue; fi
            echo "applying $base"
            psql "$DB" -v ON_ERROR_STOP=1 -q -f "$f"
            applied=$((applied + 1))
          done
          echo "applied $applied migration(s) from $FROM"
