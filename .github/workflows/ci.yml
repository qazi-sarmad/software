name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The hosted test project is shared. Two runs applying migrations at the same
# time race on DDL (relation/policy already exists, tuple concurrently updated).
# Serialise them; never cancel a run mid-migration.
concurrency:
  group: provio-test-db
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 1. Type check
        run: npx tsc --noEmit

      - name: 2. Unit tests
        run: npx vitest run

      - name: 3. Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: npx vite build

      - name: 4. Token check
        run: node scripts/check-tokens.mjs

      - name: 5. Shrink check
        run: node scripts/check-shrink.mjs

      - name: 6. Migrations and SQL tests (test project only)
        if: ${{ hashFiles('supabase/migrations/**') != '' }}
        env:
          TEST_SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          # Never echo the URL. Fail loudly if the secret is empty.
          if [ -z "$TEST_SUPABASE_DB_URL" ]; then echo "::error::TEST_SUPABASE_DB_URL is empty"; exit 1; fi
          for f in supabase/migrations/*.sql; do
            psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in supabase/tests/*.sql; do
            psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: 7. Playwright
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
