name: CI

on:
  push:
    branches: [main, feature/board-ai-control-plane, feature/writing-engine, feature/scale-harden-v1]
  pull_request:
  workflow_dispatch:

# The hosted test project is shared. Step 7 no longer touches it (it runs a runner-local
# cluster), but step 8 (Playwright) and step 9 (screenshot sweep) still write to it, and two
# runs doing so at the same time race on DDL (relation/policy already exists, tuple concurrently
# updated). Serialise those; never cancel a run mid-migration.
concurrency:
  group: provio-test-db
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-24.04
    # Measured on run 40485222778: Playwright ~6m and the screenshot sweep needs its full 15m; a
    # 45m job limit cancelled the sweep mid-flight (steps 1-14 all green, step 15 cancelled at
    # 14.1m). Step 7 now runs a runner-local cluster rather than ~23m of network round-trips to the
    # hosted project, but 75m is kept as a generous ceiling so the sweep always has its own budget.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 1. Type check
        run: npx tsc --noEmit

      - name: 2. Unit tests
        run: npx vitest run

      - name: 3. Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: npx vite build

      - name: 4. Token check
        run: node scripts/check-tokens.mjs

      - name: 5. Shrink check
        run: node scripts/check-shrink.mjs

      - name: 6. Tutorial check
        env:
          # CI records nothing live (no backend), so the committed GIFs are placeholders. They are
          # allowed here only with this flag, and the count is printed; the pre-PR gate runs --strict.
          TUTORIALS_ALLOW_PLACEHOLDER: '1'
        run: npm run check-tutorials

      - name: 6b. Edge Function deploy list
        run: node scripts/check-function-deploy-list.mjs

      - name: 6c. UI contract
        run: node scripts/check-ui-contract.mjs

      - name: 6d. Anti-theatre gates (G2 dead code, G3 config-effect, G4 wiring, G5 two-sources, G6 RPC parity, R0 register)
        # R0 (check-feature-register) is the automated form of "verify wiring by grepping the call
        # site": it fails when a Wired row names a src/data or src/lib export no screen calls, and
        # when an Inert row names one that IS called. It existed and was green but no CI step ran it,
        # so a row could drift from the code unnoticed. It is the gate most likely to catch the exact
        # defect this branch exists to close, so it belongs here.
        run: |
          node scripts/check-dead-code.mjs
          node scripts/check-config-effect.mjs
          node scripts/check-wiring.mjs
          node scripts/check-two-sources.mjs
          node scripts/check-rpc-parity.mjs
          node scripts/check-feature-register.mjs

      - name: 7. Migrations and SQL tests (runner-local PostgreSQL)
        # Previously this applied 116 migrations and 121 test files to the hosted test project with
        # one `psql -f` per file: 237 connections and ~16k DDL/WAL statements per run. That is what
        # exhausted the project's Disk IO budget. The suite needs no cloud data (the shim supplies
        # the Supabase parts), so it now runs against a throwaway cluster inside the runner and the
        # hosted project is never touched by this step.
        if: ${{ hashFiles('supabase/migrations/**') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          # The runner image ships a cluster that is often already running, and `pg_ctlcluster start`
          # exits 2 in that case ("Cluster is already running"), so the start is best-effort and
          # connectivity is what we actually assert. Version is read from the filesystem rather than
          # pinned: the suite needs no version-specific syntax (only security_invoker, PG15+).
          PGVER="$(ls /usr/lib/postgresql | sort -V | tail -1)"
          sudo pg_ctlcluster "$PGVER" main start || true
          sudo -n -u postgres psql -tAc 'select 1' >/dev/null || { echo "::error::postgres not reachable"; exit 1; }
          bash scripts/local-sql-harness.sh

      - name: 8. Playwright (dev server) and 8b. G1 production-build E2E
        # Step 8 drives the dev server (fast feedback). Step 8b sets E2E_PROD=1 so the same suite
        # runs against the built bundle from `vite preview` on 4173 — the G1 anti-theatre gate, which
        # exists in playwright.config.ts and e2e/phase1-production-build.spec.ts but had no CI runner
        # until now (no job step ever set E2E_PROD, so G1 never executed here while the ledger
        # reported it PASS from a manual run). Both use the hosted test project, so the concurrency
        # group above must still serialise this job against a second run.
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
          echo "--- G1: production bundle ---"
          npm run build
          E2E_PROD=1 npx playwright test --project=chromium

      - name: 9. Screenshot sweep (all presets and themes)
        # C5.4 (spec §29). Captures every contract screen in three presets and two themes and
        # uploads the PNGs as an artifact. Never committed (artifacts/screenshots/ is git-ignored).
        continue-on-error: true
        # The sweep drives the dev server below, and the app reads only VITE_SUPABASE_*: without
        # them src/data/client.ts returns null, every sign-in times out, and 53 captures x 6
        # preset/theme combinations grind through their timeouts until the job's own limit cancels
        # the whole run. The step keeps its own smaller limit so a slow sweep fails this step
        # instead of cancelling the run.
        timeout-minutes: 15
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Seed the synthetic users (writes e2e/.auth/passwords.json, git-ignored).
          npx tsx e2e/global-setup.ts || true
          # Start the dev server the sweep drives, wait for it, then run the sweep and stop it.
          npm run dev > /tmp/screenshots-dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run screenshots || echo "screenshot sweep did not complete; see manifest.json"
          kill $DEV_PID || true
      - name: Upload screenshots
        if: always() && hashFiles('artifacts/screenshots/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
