name: Keep test project awake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase test project
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # /auth/v1/health is the GoTrue health endpoint; it wakes the project
          # and returns 200 with the apikey header. Print the code, not just OK.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$TEST_SUPABASE_URL/auth/v1/health" \
            -H "apikey: $TEST_SUPABASE_PUBLISHABLE_KEY")
          echo "auth/v1/health HTTP $CODE"
          if [ "$CODE" != "200" ]; then echo "::error::keepalive ping failed (HTTP $CODE)"; exit 1; fi
