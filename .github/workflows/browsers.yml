name: Browsers (Firefox / WebKit)

# R6d: cross-browser coverage. Dispatch-only so the main CI stays fast and the shared test
# database is not raced. The caller picks one engine; the project name in playwright.config.ts
# selects the device.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Playwright project to run'
        required: true
        default: firefox
        type: choice
        options: [firefox, webkit, all]

concurrency:
  group: provio-test-db
  cancel-in-progress: false

jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install browsers
        run: npx playwright install --with-deps firefox webkit

      - name: Playwright (cross-browser)
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
        run: |
          case "${{ inputs.browser }}" in
            all) npx playwright test --project=firefox --project=webkit ;;
            *)   npx playwright test --project=${{ inputs.browser }} ;;
          esac

      - name: Upload Playwright report on failure
        if: failure() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.browser }}
          path: playwright-report/
          retention-days: 14
