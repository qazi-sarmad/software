<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security headers (WP10). The header set in public/_headers and vite.config.ts is the
         authority; these meta tags carry the subset that also works in a document. `frame-ancestors`
         is header-only and lives in _headers. Fonts are self-hosted (@fontsource, see src/index.css),
         so the policy allows no external origin at all; the only external connection is Supabase. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Provio - Enterprise Internal Audit Platform</title>
    <meta name="description" content="Cryptographically sealed enterprise internal-audit platform with deterministic testing math, verifiable populations, and immutable hash-chained ledger." />
    <meta property="og:title" content="Provio - Enterprise Internal Audit Platform" />
    <meta property="og:description" content="Cryptographically sealed enterprise internal-audit platform with deterministic testing math, verifiable populations, and immutable hash-chained ledger." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
